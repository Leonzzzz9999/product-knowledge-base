<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品知识库查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .result-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .result-info {
            flex: 1;
        }
        
        .result-info h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-info p {
            color: #666;
            margin-bottom: 8px;
        }
        
        .result-info .category {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .no-result {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            margin-bottom: 15px;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
        }
        
        #fileInput {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 产品知识库查询</h1>
        
        <div class="card">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('search')">📝 按型号查询</div>
                <div class="tab" onclick="switchTab('upload')">📷 按图片查询</div>
            </div>
            
            <!-- 型号查询 -->
            <div id="searchTab" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="modelInput" placeholder="输入产品型号，如 SKU-001">
                    <button onclick="searchByModel()">查询</button>
                </div>
                <div id="searchResult" class="result"></div>
            </div>
            
            <!-- 图片查询 -->
            <div id="uploadTab" class="tab-content">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">点击或拖拽上传图片</div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
                <button onclick="searchByImage()" id="uploadBtn" style="width: 100%; display: none;">开始识别</button>
                <div id="uploadResult" class="result"></div>
                <div class="note">
                    💡 图片识别功能需要配置 AI API，当前版本仅支持型号查询。
                    如需图片识别功能，请联系管理员配置。
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // 配置（从环境变量或 api.js 获取）
        if (typeof FEISHU_CONFIG === 'undefined') {
            var FEISHU_CONFIG = {
                APP_TOKEN: '',
                TABLE_ID: ''
            };
        }
    </script>
</body>
</html>
