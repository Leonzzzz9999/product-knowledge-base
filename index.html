<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品知识库查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        button.secondary:hover {
            background: #5a6268;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .result-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .result-info {
            flex: 1;
        }
        
        .result-info h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-info p {
            color: #666;
            margin-bottom: 8px;
        }
        
        .result-info .category {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .no-result {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            margin-bottom: 15px;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
        }
        
        #fileInput {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            color: #856404;
        }
        
        .iframe-container {
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        
        .help-text {
            text-align: center;
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .status-bar {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-indicator.online {
            background: #28a745;
        }
        
        .status-indicator.offline {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 产品知识库查询</h1>
        
        <div class="card">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('search')">📝 按型号查询</div>
                <div class="tab" onclick="switchTab('upload')">📷 按图片查询</div>
                <div class="tab" onclick="switchTab('data')">📊 数据管理</div>
            </div>
            
            <!-- 型号查询 -->
            <div id="searchTab" class="tab-content active">
                <div class="status-bar">
                    <span><span class="status-indicator offline" id="statusIndicator"></span>数据来源：演示数据</span>
                    <button class="secondary" onclick="switchTab('data')" style="padding: 6px 12px; font-size: 12px;">查看全部数据</button>
                </div>
                <div class="search-box">
                    <input type="text" id="modelInput" placeholder="输入产品型号，如 SKU-001">
                    <button onclick="searchByModel()">查询</button>
                </div>
                <div id="searchResult" class="result"></div>
            </div>
            
            <!-- 图片查询 -->
            <div id="uploadTab" class="tab-content">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">点击或拖拽上传图片</div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
                <button onclick="searchByImage()" id="uploadBtn" style="width: 100%; display: none;">开始识别</button>
                <div id="uploadResult" class="result"></div>
                <div class="note">
                    💡 图片识别功能需要配置 AI API，当前版本仅支持型号查询。
                    如需图片识别功能，请联系管理员配置。
                </div>
            </div>
            
            <!-- 数据管理 -->
            <div id="dataTab" class="tab-content">
                <p style="color: #666; margin-bottom: 15px;">
                    点击下方按钮打开飞书数据表格，您可以查看、添加、编辑和删除产品数据。
                </p>
                <button onclick="openFeishuTable()" style="width: 100%; margin-bottom: 15px;">
                    🚀 打开飞书数据表格
                </button>
                <p class="help-text">
                    💡 在飞书表格中，您可以：<br>
                    • 添加新产品（型号 + 图片 + 类别）<br>
                    • 编辑现有产品信息<br>
                    • 删除不需要的产品
                </p>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // 飞书表格链接
        const FEISHU_TABLE_URL = 'https://jcn05t3p2dzw.feishu.cn/base/D9Jxbdac9aFAb8sYdC1cmWFrn9g';
        
        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            if (tab === 'search') {
                tabs[0].classList.add('active');
                document.getElementById('searchTab').classList.add('active');
            } else if (tab === 'upload') {
                tabs[1].classList.add('active');
                document.getElementById('uploadTab').classList.add('active');
            } else if (tab === 'data') {
                tabs[2].classList.add('active');
                document.getElementById('dataTab').classList.add('active');
            }
        }
        
        // 打开飞书表格
        function openFeishuTable() {
            window.open(FEISHU_TABLE_URL, '_blank');
        }
    </script>
</body>
</html>
